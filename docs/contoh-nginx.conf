# =====================================================================
# KarirKu Polinema · contoh konfigurasi nginx (HTTPS + PHP-FPM)
# Salin ke /etc/nginx/sites-available/karirku, ubah bagian bertanda GANTI, lalu:
#   nginx -t && systemctl reload nginx
# Header keamanan (CSP, HSTS, X-Frame-Options, dst.) dikirim oleh aplikasi sendiri
# (app/core/bootstrap.php); jangan digandakan di sini agar nonce CSP tidak bentrok.
# =====================================================================

# Pembatas laju per IP. Kunci kosong = tidak dibatasi.
map $request_uri $kunci_auth {
    default "";
    ~^/auth/(proses-masuk|proses-lupa-sandi|proses-daftar|proses-reset-sandi) $binary_remote_addr;
}
limit_req_zone $kunci_auth        zone=auth:10m rate=10r/m;   # login, daftar, lupa/reset sandi
limit_req_zone $binary_remote_addr zone=umum:10m rate=30r/s;   # semua halaman dinamis
limit_req_status 429;

server {
    listen 80;
    server_name karirku.contoh.ac.id;                          # GANTI
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name karirku.contoh.ac.id;                          # GANTI

    ssl_certificate     /etc/letsencrypt/live/karirku.contoh.ac.id/fullchain.pem;   # GANTI
    ssl_certificate_key /etc/letsencrypt/live/karirku.contoh.ac.id/privkey.pem;     # GANTI
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;                       # jangan umumkan versi nginx
    client_max_body_size 8m;                 # samakan dengan batas unggah aplikasi (+ sedikit ruang)

    root /opt/karirku/public;                # GANTI: HARUS folder public/, bukan folder proyek
    index index.php;

    # Berkas tersembunyi (.git, .env, .htaccess) tidak pernah dilayani; .well-known untuk Let's Encrypt.
    location ~ /\.(?!well-known) { deny all; }

    # Lapis cadangan: document root sudah public/, jadi folder ini memang di luar jangkauan.
    location ~ ^/(app|storage|database|tests|docs|scripts)(/|$) { return 404; }

    # Halaman prototipe statis tidak dipakai di produksi.
    location ~ ^/(admin|daftar|index|info-loker|mahasiswa|masuk|perusahaan|status-akun)\.html$ { return 404; }

    location / { try_files $uri $uri/ @app; }
    location @app { rewrite ^/(.*)$ /index.php?url=$1 last; }

    # Berkas statis: cache panjang (aman karena nama berkas berubah bila isinya berubah).
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        limit_req zone=auth  burst=5  nodelay;
        limit_req zone=umum  burst=60 nodelay;

        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;                              # aplikasi menandai cookie Secure + HSTS
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;          # GANTI sesuai versi PHP
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
}
